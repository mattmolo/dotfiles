# Ring the bell if any background window rang a bell
set -g bell-action any
set -g focus-events on

# Default termtype. If the rcfile sets $TERM, that overrides this value.
set -g default-terminal "tmux-256color"
# Enable true color (24-bit) for various terminal emulators
set -as terminal-features ",xterm-256color:RGB,alacritty:RGB,kitty:RGB,ghostty:RGB"

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Create splits and vertical splits
bind  v split-window -h -l 50% -c "#{pane_current_path}"
bind ^V split-window -h -l 50% -c "#{pane_current_path}"
bind  s split-window    -l 50% -c "#{pane_current_path}"
bind ^S split-window    -l 50% -c "#{pane_current_path}"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Pane resize in all four directions using vi bindings.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# C-w cycles panes. nvim gets the key itself and moves on to the next pane
# from its last split (see nvim/lua/config/keymaps.lua).
bind -n C-w if -F '#{m/r:^n?vim$,#{pane_current_command}}' 'send-keys C-w' 'select-pane -t :.+'

# display pane numbers to switch between them with C-q
bind -n C-q display-panes
# default time for display panes is too fast
set -g display-panes-time 50000

# switch windows with Ctrl+Space, and Ctrl+Alt+space
bind -n C-Space next-window
bind -n C-M-Space previous-window

# Use vi keybindings for tmux commandline input.
# Note that to get command mode you need to hit ESC twice...
set -g status-keys vi

# Use vi keybindings in copy and choice modes
set -g mode-keys vi
#bind -t vi-copy 'v' begin-selection
#bind -t vi-copy 'y' copy-selection

# easily toggle synchronization (mnemonic: e is for echo)
# sends input to all panes in a given window.
bind e set synchronize-panes on
bind E set synchronize-panes off

# set first window to index 1 (not 0) to map more to the keyboard layout...
set-option -g base-index 1
set-window-option -g pane-base-index 1

# renumber closed windows
set-option -g renumber-windows on

# color scheme
set -g status-left-length 52
set -g status-right-length 451

set -g status-style fg=white,bg=colour237
set -g pane-border-style fg=colour245
set -g pane-active-border-style fg=colour69
set -g message-style "fg=colour16,bg=colour69,bold"

# Status Content
set -g status-left "#[fg=colour235,bg=colour69,bold] #S #[fg=colour238,bg=colour237,nobold] "
set -g window-status-format "#[fg=colour249]|  #I: #W "
set -g window-status-current-format "#[fg=colour249]| #[fg=colour252,bg=colour240] #I: #W #[bg=colour237]"
set -g status-right "#h • %B %d • %I:%M %p "

# Agressive resize when clients aren't looking
set -g aggressive-resize on

# Screen like binding
unbind C-b
set -g prefix C-a
bind a send-prefix

# No escape time for vi mode
# https://superuser.com/a/252717
set -sg escape-time 0

# Screen like binding for last window
unbind l
bind C-a last-window

# Bigger history
set -g history-limit 100000

# New windows/pane in $PWD
bind c new-window -c "#{pane_current_path}"

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Local config
if-shell "[ -f ~/.tmux.conf.user ]" 'source ~/.tmux.conf.user'
